<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes orbitFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    .bg-circle {
      transform-origin: center;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 12 16;
      animation: orbitFlow 25s linear infinite;
    }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="bg-circle" cx="200" cy="100" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle class="bg-circle" cx="1020" cy="240" r="160" fill="#7c3aed" opacity="0.22" filter="url(#glow)" />
  <circle class="bg-circle" cx="600" cy="300" r="180" fill="#0d9488" opacity="0.15" filter="url(#glow)" />

  <!-- Background Animated Flow Lines (Digital Thread / Lifecycle Loop) -->
  <g opacity="0.45">
    <path class="flow-line" d="M -50 280 C 300 380, 400 60, 750 140 C 950 180, 1100 80, 1250 120" fill="none" stroke="url(#orbitGrad1)" stroke-width="2.5" />
    <path class="flow-line" d="M -50 80 C 250 40, 450 320, 800 240 C 1000 190, 1150 300, 1250 260" fill="none" stroke="url(#orbitGrad2)" stroke-width="2" />
  </g>

  <!-- Modern Geometric Lifecycle Node Accents in Background -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="5" fill="#38bdf8" />
    <line x1="150" y1="80" x2="220" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="220" cy="130" r="4" fill="#818cf8" />
    <circle cx="1050" cy="100" r="5" fill="#c084fc" />
    <line x1="1050" y1="100" x2="980" y2="150" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="980" cy="150" r="4" fill="#38bdf8" />
  </g>

  <!-- Foreground Title and Branding Content (Elevated with Shadow & High Contrast) -->
  <g filter="url(#shadow)">
    <!-- Top Micro Tag / Breadcrumb -->
    <rect x="425" y="42" width="350" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="600" y="61" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">⚙️ ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="132" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5" fill="url(#textGrad)">
      Product Lifecycle Management
    </text>

    <!-- Subtitle (Always in Crisp Foreground) -->
    <text x="600" y="174" font-size="18" font-weight="500" fill="#f8fafc" text-anchor="middle" letter-spacing="0.2">
      Curated Platforms for BOM, Engineering Change Orders (ECO), CAD &amp; Digital Thread
    </text>
  </g>

  <!-- Foreground Dynamic Interactive Feature Pills (Floating cleanly below text) -->
  <g class="pill-1" transform="translate(0, 0)">
    <!-- EBOM / MBOM Pill -->
    <g transform="translate(180, 230)">
      <rect width="180" height="44" rx="22" fill="url(#pillGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="26" cy="22" r="9" fill="#0284c7" />
      <text x="26" y="26" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
      <text x="45" y="27" font-size="13" font-weight="700" fill="#e2e8f0">Multi-Level BOM</text>
    </g>

    <!-- CAD / EDA Integration Pill -->
    <g transform="translate(840, 230)">
      <rect width="180" height="44" rx="22" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="26" cy="22" r="9" fill="#a855f7" />
      <text x="26" y="26" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
      <text x="45" y="27" font-size="13" font-weight="700" fill="#e2e8f0">CAD / PDM Sync</text>
    </g>
  </g>

  <g class="pill-2" transform="translate(0, 0)">
    <!-- ECO Workflows Pill -->
    <g transform="translate(400, 230)">
      <rect width="170" height="44" rx="22" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="26" cy="22" r="9" fill="#10b981" />
      <text x="26" y="26" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
      <text x="45" y="27" font-size="13" font-weight="700" fill="#e2e8f0">ECO &amp; Workflows</text>
    </g>

    <!-- Digital Thread Pill -->
    <g transform="translate(610, 230)">
      <rect width="190" height="44" rx="22" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="26" cy="22" r="9" fill="#f59e0b" />
      <text x="26" y="26" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
      <text x="45" y="27" font-size="13" font-weight="700" fill="#e2e8f0">Digital Thread &amp; Twin</text>
    </g>
  </g>

  <!-- Bottom Accent Status Indicator -->
  <g transform="translate(490, 310)">
    <circle cx="8" cy="8" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="12" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">CONTINUOUSLY UPDATED &amp; VERIFIED</text>
  </g>
</svg>
